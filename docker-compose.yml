# MeshRelay Server as a Docker Compose stack (what the infra-TAK MeshRelay
# module deploys). Settings come from .env next to this file, which the
# installer writes:
#
#   MESHRELAY_VERSION=v4.8.0           image tag / version shown in the dashboard
#   MESHRELAY_WEB_PORT=8770             dashboard, on the host's 127.0.0.1 only
#   MESHRELAY_PTT_PORT=5000             phones (UDP, public)
#   MESHRELAY_ADMIN_PASSWORD=...        initial super admin password (first
#                                       start only; ignored once accounts exist)
#   MESHRELAY_OIDC_*                    single sign-on (see oidc.go); optional
#
# A docker-compose.override.yml next to this file (written by the installer)
# may add extra_hosts so the container reaches the identity provider through
# the host's own proxy.
#
# The dashboard is plain HTTP on loopback; Caddy (or any proxy) on the host
# terminates HTTPS and forwards to 127.0.0.1:${MESHRELAY_WEB_PORT}.

name: meshrelay

services:
  meshrelay:
    build:
      context: .
      args:
        VERSION: ${MESHRELAY_VERSION:-dev}
    image: meshrelay-server:${MESHRELAY_VERSION:-dev}
    container_name: meshrelay-server
    restart: unless-stopped
    environment:
      MESHRELAY_MANAGED: infratak
      MESHRELAY_TRUST_PROXY: "1"
      # Caddy on the host reaches the container through the Docker network's
      # gateway; the server looks that address up itself (no fixed subnet,
      # which could collide with a cloud VPC's addresses).
      MESHRELAY_TRUSTED_PROXIES: gateway
      MESHRELAY_ADMIN_PASSWORD: ${MESHRELAY_ADMIN_PASSWORD:-}
      # Single sign-on (oidc.go); all empty = password sign-in only.
      MESHRELAY_OIDC_ISSUER: ${MESHRELAY_OIDC_ISSUER:-}
      MESHRELAY_OIDC_CLIENT_ID: ${MESHRELAY_OIDC_CLIENT_ID:-}
      MESHRELAY_OIDC_CLIENT_SECRET: ${MESHRELAY_OIDC_CLIENT_SECRET:-}
      MESHRELAY_OIDC_REDIRECT_URL: ${MESHRELAY_OIDC_REDIRECT_URL:-}
      MESHRELAY_OIDC_LABEL: ${MESHRELAY_OIDC_LABEL:-}
      # infra-TAK's loopback provisioning calls (TAK link, managed_tak.go).
      MESHRELAY_MANAGE_TOKEN: ${MESHRELAY_MANAGE_TOKEN:-}
      # IP mode (no domain, nothing in front): HTTPS with a self-signed
      # certificate for these addresses (selfsigned.go).
      MESHRELAY_TLS_SELF_SIGNED: ${MESHRELAY_TLS_SELF_SIGNED:-}
      MESHRELAY_TLS_HOSTS: ${MESHRELAY_TLS_HOSTS:-}
    ports:
      # 127.0.0.1 behind Caddy; 0.0.0.0 only in IP mode (self-signed HTTPS).
      - "${MESHRELAY_WEB_HOST:-127.0.0.1}:${MESHRELAY_WEB_PORT:-8770}:8770/tcp"
      - "${MESHRELAY_PTT_PORT:-5000}:5000/udp"
    volumes:
      - meshrelay-data:/data
    networks:
      - meshrelay
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  meshrelay:

volumes:
  meshrelay-data:
