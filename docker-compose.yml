# MeshRelay Server as a Docker Compose stack (what the infra-TAK MeshRelay
# module deploys). Settings come from .env next to this file, which the
# installer writes:
#
#   MESHRELAY_VERSION=v4.6.0            image tag / version shown in the dashboard
#   MESHRELAY_WEB_PORT=8770             dashboard, on the host's 127.0.0.1 only
#   MESHRELAY_PTT_PORT=5000             phones (UDP, public)
#   MESHRELAY_ADMIN_PASSWORD=...        initial super admin password (first
#                                       start only; ignored once accounts exist)
#
# The dashboard is plain HTTP on loopback; Caddy (or any proxy) on the host
# terminates HTTPS and forwards to 127.0.0.1:${MESHRELAY_WEB_PORT}.

name: meshrelay

services:
  meshrelay:
    build:
      context: .
      args:
        VERSION: ${MESHRELAY_VERSION:-dev}
    image: meshrelay-server:${MESHRELAY_VERSION:-dev}
    container_name: meshrelay-server
    restart: unless-stopped
    environment:
      MESHRELAY_MANAGED: infratak
      MESHRELAY_TRUST_PROXY: "1"
      # Caddy on the host reaches the container through the Docker network's
      # gateway; the server looks that address up itself (no fixed subnet,
      # which could collide with a cloud VPC's addresses).
      MESHRELAY_TRUSTED_PROXIES: gateway
      MESHRELAY_ADMIN_PASSWORD: ${MESHRELAY_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${MESHRELAY_WEB_PORT:-8770}:8770/tcp"
      - "${MESHRELAY_PTT_PORT:-5000}:5000/udp"
    volumes:
      - meshrelay-data:/data
    networks:
      - meshrelay
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  meshrelay:

volumes:
  meshrelay-data:
