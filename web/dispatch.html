<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshRelay Dispatch</title>
    <link rel="stylesheet" href="dispatch.css">
</head>
<body>
    <!-- Click-to-enable-audio banner (browsers block autoplay until a user gesture) -->
    <div id="audio-unlock-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:9999; background:#7C3AED; color:#fff; padding:12px 16px; text-align:center; cursor:pointer; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,0.3);">
        🔊 Click here to enable incoming audio
    </div>

    <!-- Header -->
    <header class="dispatch-header">
        <div class="dispatch-header-left">
            <img src="logo.png" alt="MeshRelay" class="dispatch-logo">
            <span class="dispatch-title">Dispatch Console</span>
            <span class="dispatch-agency" id="dispatch-agency-label"></span>
        </div>
        <div class="dispatch-header-right">
            <span class="dispatch-user" id="dispatch-user-label"></span>
            <span id="dispatch-ws-status" class="ws-status ws-connecting">Connecting...</span>
            <button class="dispatch-logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- Main layout -->
    <div class="dispatch-layout">

        <!-- Left panel: Active Units -->
        <section class="dispatch-panel units-panel">
            <div class="panel-header">
                <h2>Active Units</h2>
                <span class="unit-count" id="unit-count">0 online</span>
            </div>
            <div class="units-filter">
                <input type="text" id="unit-search" placeholder="Search units..." oninput="filterUnits()">
                <select id="unit-channel-filter" onchange="filterUnits()">
                    <option value="">All Channels</option>
                </select>
            </div>
            <div class="units-list" id="units-list">
                <div class="units-empty">No units connected</div>
            </div>
        </section>

        <!-- Right panel: PTT Controls -->
        <section class="dispatch-panel ptt-panel">
            <div class="panel-header">
                <h2>PTT Controls</h2>
            </div>

            <!-- Channel selector -->
            <div class="ptt-channel-row">
                <label class="ptt-label">Transmit Channel</label>
                <div class="channel-selector">
                    <button class="ch-btn" onclick="changeChannel(-1)">&#8722;</button>
                    <span class="channel-display" id="channel-display">CH 0</span>
                    <button class="ch-btn" onclick="changeChannel(1)">&#43;</button>
                </div>
                <span class="channel-unit-count" id="channel-unit-count">0 units on this channel</span>
            </div>

            <!-- PTT Button -->
            <div class="ptt-btn-area">
                <button
                    id="ptt-btn"
                    class="ptt-btn"
                    onmousedown="startPTT()"
                    onmouseup="stopPTT()"
                    onmouseleave="stopPTT()"
                    ontouchstart="startPTT(event)"
                    ontouchend="stopPTT()"
                >
                    <div class="ptt-icon">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="22"/>
                            <line x1="8" y1="22" x2="16" y2="22"/>
                        </svg>
                    </div>
                    <span class="ptt-label-text">HOLD TO TALK</span>
                </button>
                <div class="ptt-hint">Press and hold to transmit on CH <span id="ptt-ch-hint">0</span></div>
            </div>

            <!-- Status indicators -->
            <div class="status-indicators">
                <div class="status-row" id="status-ready">
                    <span class="status-dot dot-green"></span>
                    <span>Ready</span>
                </div>
                <div class="status-row" id="status-transmitting" style="display:none;">
                    <span class="status-dot dot-red pulse"></span>
                    <span>Transmitting</span>
                </div>
                <div class="status-row" id="status-receiving" style="display:none;">
                    <span class="status-dot dot-blue pulse"></span>
                    <span>Receiving — <span id="receiving-from"></span></span>
                </div>
                <div class="status-row" id="status-mic-error" style="display:none;">
                    <span class="status-dot dot-yellow"></span>
                    <span id="mic-error-text">Mic access denied — <a href="#" onclick="requestMic()">Retry</a></span>
                </div>
            </div>

            <!-- Volume control for incoming -->
            <div class="volume-row">
                <label class="ptt-label">Incoming Volume</label>
                <input type="range" id="volume-slider" min="0" max="2" step="0.05" value="1" oninput="setVolume(this.value)">
                <span id="volume-display">100%</span>
            </div>

            <!-- Audio visualizer -->
            <canvas id="audio-visualizer" class="audio-viz" width="320" height="60"></canvas>
        </section>
    </div>

    <script src="dispatch.js?v=8"></script>
</body>
</html>
