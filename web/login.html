<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshRelay - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0B0E14;
            color: #E6EDF3;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #0D1117;
            border: 1px solid #1E2733;
            border-radius: 14px;
            padding: 40px;
            width: 380px;
            text-align: center;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 16px;
        }
        .login-card h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #E6EDF3;
        }
        .login-card p {
            color: #8B949E;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-input {
            width: 100%;
            padding: 12px 16px;
            background: #151B23;
            border: 1px solid #2A3441;
            border-radius: 8px;
            color: #E6EDF3;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-input:focus {
            border-color: #7C3AED;
        }
        .login-input::placeholder {
            color: #4D5562;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #7C3AED;
            color: #FFF;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #6D28D9;
        }
        .login-btn:disabled {
            background: #2A3441;
            cursor: not-allowed;
        }
        .login-error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.25);
            color: #F87171;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="logo.png" alt="MeshRelay" class="login-logo">
        <h1>MeshRelay</h1>
        <p>Sign in to access the dashboard</p>
        <div id="error" class="login-error"></div>
        <input type="text" id="agency" class="login-input" placeholder="Agency ID">
        <input type="text" id="username" class="login-input" placeholder="Username" autocomplete="username">
        <input type="password" id="password" class="login-input" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn" class="login-btn" onclick="login()">Sign In</button>
    </div>
    <script>
        function login() {
            const agency_id = document.getElementById('agency').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorEl.textContent = 'Username and password are required';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorEl.style.display = 'none';

            fetch('/api/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, agency_id })
            })
            .then(r => r.json().then(data => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    return;
                }
                window.location.href = afterLogin(data.role);
            })
            .catch(() => {
                errorEl.textContent = 'Connection error';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            });
        }

        // Where to go after signing in. A page that sent you here (e.g. /command)
        // passes ?next=; only known same-site pages are honoured, never an
        // arbitrary URL (open-redirect).
        function afterLogin(role) {
            if (role === 'dispatch') return '/command';
            const next = new URLSearchParams(window.location.search).get('next');
            const allowed = ['/', '/command'];
            return allowed.includes(next) ? next : '/';
        }

        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('agency').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('username').focus();
        });
        document.getElementById('username').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        // If already logged in, redirect to appropriate page based on role
        fetch('/api/session', { credentials: 'same-origin' })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            if (data && data.status === 'ok') {
                window.location.href = afterLogin(data.role);
            }
        })
        .catch(() => {});

        document.getElementById('agency').focus();
    </script>
</body>
</html>
